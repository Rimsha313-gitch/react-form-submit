<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">
      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      function SubmitFormApp() {
        
        const [inputText, setInputText] = React.useState('');

        const [submittedText, setSubmittedText] = React.useState('');

        function handleSubmit(event) {
          
          event.preventDefault();
        
          setSubmittedText(inputText);
          
          setInputText('');
        }

        return (
          <div style={{ padding: '20px', fontFamily: 'Arial' }}>
            <h2>React Form Submit Example</h2>
            
    
            <form onSubmit={handleSubmit}>
              <input 
                type="text" 
                placeholder="write your name " 
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                style={{ padding: '8px', fontSize: '16px', width: '220px' }}
              />
              <button type="submit" style={{ padding: '9px 15px', marginLeft: '5px', fontSize: '16px' }}>
                Submit
              </button>
            </form>


            {submittedText && (
              <p style={{ color: 'green', marginTop: '15px' }}>
                <b>Form Submitted!</b> Your name is: {submittedText}
              </p>
            )}
          </div>
        );
      }

      root.render(<SubmitFormApp />);
    </script>
  </body>
</html>
